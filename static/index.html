<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Therapy System — Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary: #08090d;
            --bg-secondary: #0e1117;
            --bg-card: rgba(14, 17, 23, 0.7);
            --border-subtle: rgba(255,255,255,0.04);
            --border-accent: rgba(100, 200, 255, 0.12);
            --text-primary: #f0f2f5;
            --text-secondary: #8b95a5;
            --text-muted: #4a5568;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --green: #34d399;
            --amber: #fbbf24;
            --rose: #f43f5e;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient Background */
        .ambient-bg {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(ellipse 80% 60% at 20% 10%, rgba(56, 189, 248, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse 60% 50% at 80% 90%, rgba(168, 85, 247, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse 40% 40% at 50% 50%, rgba(56, 189, 248, 0.02) 0%, transparent 60%);
        }

        /* Noise Texture Overlay */
        .noise-overlay {
            position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.015;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .app-container { position: relative; z-index: 2; max-width: 1440px; margin: 0 auto; padding: 24px 32px; }

        /* ─── Glass Card ─── */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(40px) saturate(1.2);
            -webkit-backdrop-filter: blur(40px) saturate(1.2);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            transition: border-color 0.5s ease, box-shadow 0.5s ease;
        }
        .card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
        }
        .card:hover { border-color: rgba(255,255,255,0.08); box-shadow: 0 8px 40px rgba(0,0,0,0.3); }

        /* ─── Top Bar ─── */
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 0; margin-bottom: 24px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .topbar h1 {
            font-size: 20px; font-weight: 700; letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .topbar .sub { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); margin-top: 2px; }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px; border-radius: 10px;
            font-size: 13px; font-weight: 600; letter-spacing: 0.01em;
            border: 1px solid var(--border-subtle);
            background: rgba(255,255,255,0.03);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; overflow: hidden;
        }
        .btn::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.03) 100%);
            opacity: 0; transition: opacity 0.3s;
        }
        .btn:hover { background: rgba(255,255,255,0.06); color: var(--text-primary); border-color: rgba(255,255,255,0.1); transform: translateY(-1px); }
        .btn:hover::after { opacity: 1; }
        .btn:active { transform: translateY(0); }

        .btn-accent {
            background: linear-gradient(135deg, rgba(56,189,248,0.1) 0%, rgba(56,189,248,0.05) 100%);
            border-color: rgba(56,189,248,0.2);
            color: var(--accent);
        }
        .btn-accent:hover { background: linear-gradient(135deg, rgba(56,189,248,0.18) 0%, rgba(56,189,248,0.08) 100%); border-color: rgba(56,189,248,0.35); box-shadow: 0 0 20px var(--accent-glow); }

        .btn-rose {
            background: linear-gradient(135deg, rgba(244,63,94,0.08) 0%, rgba(244,63,94,0.03) 100%);
            border-color: rgba(244,63,94,0.2); color: var(--rose);
        }
        .btn-rose:hover { background: linear-gradient(135deg, rgba(244,63,94,0.15) 0%, rgba(244,63,94,0.06) 100%); border-color: rgba(244,63,94,0.35); box-shadow: 0 0 20px rgba(244,63,94,0.1); }

        /* ─── Grid ─── */
        .grid-main { display: grid; grid-template-columns: 1fr 420px; gap: 20px; }
        @media (max-width: 1100px) { .grid-main { grid-template-columns: 1fr; } }

        /* ─── Video ─── */
        .video-wrapper { position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 16/10; background: #000; }
        .video-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .video-badge {
            position: absolute; top: 16px; left: 16px; z-index: 5;
            display: flex; align-items: center; gap: 6px;
            padding: 6px 12px; border-radius: 8px;
            font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
            background: rgba(244, 63, 94, 0.9); color: white;
            backdrop-filter: blur(8px);
        }
        .video-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: white; animation: blink 1.5s infinite; }
        @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

        .cam-select {
            position: absolute; top: 16px; right: 16px; z-index: 5;
            padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 500;
            background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-primary); outline: none; cursor: pointer;
            backdrop-filter: blur(8px); font-family: 'Inter', sans-serif;
        }

        /* ─── Stat Cards ─── */
        .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .stat-card {
            padding: 16px; border-radius: 12px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-subtle);
            text-align: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .stat-card:hover { border-color: rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); transform: translateY(-2px); }
        .stat-label { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
        .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; color: var(--accent); }
        .stat-value.green { color: var(--green); }
        .stat-value.amber { color: var(--amber); }

        /* ─── Patient Bar ─── */
        .patient-bar {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
            padding: 16px 20px; border-radius: 12px;
            background: rgba(255,255,255,0.015);
            border: 1px solid var(--border-subtle);
        }
        .patient-bar .label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 2px; }
        .patient-bar .value { font-size: 14px; font-weight: 600; color: var(--text-primary); }

        /* ─── Right Panel ─── */
        .right-col { display: flex; flex-direction: column; gap: 16px; }

        /* AI Chat */
        .ai-chat { flex: 1; display: flex; flex-direction: column; }
        .ai-chat-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px 0; }
        .ai-chat-header h3 { font-size: 13px; font-weight: 600; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; }
        .ai-chat-header h3 .indicator { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
        .ai-chat-body { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 24px; }
        .ai-dialogue { font-size: 18px; font-weight: 500; line-height: 1.6; color: var(--text-primary); max-width: 340px; }
        .ai-cmd { display: inline-block; margin-top: 16px; padding: 6px 16px; border-radius: 20px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; color: var(--accent); background: rgba(56,189,248,0.06); border: 1px solid rgba(56,189,248,0.15); }

        .mic-btn {
            padding: 6px 14px; border-radius: 20px;
            font-size: 11px; font-weight: 600;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
            color: var(--text-muted);
            cursor: pointer; transition: all 0.3s;
        }
        .mic-btn:hover { background: rgba(255,255,255,0.06); color: var(--text-secondary); }
        .mic-btn.active { background: rgba(52,211,153,0.08); border-color: rgba(52,211,153,0.25); color: var(--green); }

        /* Terminal */
        .terminal { padding: 16px 20px; flex-shrink: 0; }
        .terminal-header { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .terminal-header .circle { width: 6px; height: 6px; border-radius: 50%; }
        .terminal-body {
            height: 140px; overflow-y: auto; padding: 12px 14px; border-radius: 10px;
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.03);
            font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.7; color: var(--green);
        }
        .terminal-body::-webkit-scrollbar { width: 4px; }
        .terminal-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
        .terminal-body .line-muted { color: var(--text-muted); }
        .terminal-body .line-warn { color: var(--amber); }
        .terminal-body .line-err { color: var(--rose); }
        .terminal-body .line-info { color: var(--accent); }

        /* ─── Kill Button ─── */
        .kill-btn {
            position: fixed; bottom: 32px; right: 32px; z-index: 999;
            width: 72px; height: 72px; border-radius: 50%;
            background: linear-gradient(135deg, #dc2626, #991b1b);
            border: 3px solid rgba(255,255,255,0.15);
            color: white; font-size: 11px; font-weight: 800; letter-spacing: 0.05em;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.4), 0 0 0 0 rgba(220, 38, 38, 0.3);
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .kill-btn:hover { transform: scale(1.1); box-shadow: 0 6px 30px rgba(220, 38, 38, 0.6); }
        .kill-btn:active { transform: scale(0.95); }

        /* ─── Intro Overlay ─── */
        .intro-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: var(--bg-primary);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .intro-overlay h1 { font-size: 48px; font-weight: 800; letter-spacing: -0.04em; color: var(--text-primary); }
        .intro-overlay p { font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted); margin-top: 8px; }
        .intro-line { width: 60px; height: 2px; background: var(--accent); margin-top: 24px; border-radius: 1px; }

        /* reveal helper */
        .gs-reveal { opacity: 0; transform: translateY(30px); }
    </style>
</head>
<body>

    <!-- Ambient BG -->
    <div class="ambient-bg"></div>
    <div class="noise-overlay"></div>

    <!-- Intro Animation Overlay -->
    <div class="intro-overlay" id="intro">
        <h1 id="intro-title">Therapy</h1>
        <p id="intro-sub">Pediatric Rehabilitation System</p>
        <div class="intro-line" id="intro-line"></div>
    </div>

    <!-- App -->
    <div class="app-container" id="app" style="opacity: 0;">

        <!-- TOPBAR -->
        <div class="topbar gs-reveal">
            <div>
                <h1>Therapy Dashboard</h1>
                <div class="sub">Pediatric Rehabilitation System</div>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button class="btn btn-accent" onclick="scanBracelet('akhilesh')">
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0H5a2 2 0 01-2-2v-4m6 6h10a2 2 0 002-2v-4"/></svg>
                    Scan Akhilesh (Arm Raises X20)
                </button>
                <button class="btn btn-rose" onclick="scanBracelet('bailey')">
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0H5a2 2 0 01-2-2v-4m6 6h10a2 2 0 002-2v-4"/></svg>
                    Scan Bailey (Squats X20)
                </button>
                <button class="btn btn-accent" onclick="scanBracelet('john')">
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0H5a2 2 0 01-2-2v-4m6 6h10a2 2 0 002-2v-4"/></svg>
                    Scan John (Side Reach X20)
                </button>
                <button class="btn btn-accent" onclick="unlockTarget()" style="margin-left: 6px; background: linear-gradient(135deg, rgba(248,209,96,0.12) 0%, rgba(248,209,96,0.05) 100%); border-color: rgba(248,209,96,0.2); color: #facc15;">
                    🔓 Unlock Target
                </button>
                <span id="follow-status" style="font-size:12px; color:#9ca3af; padding-left:8px;">Following: enabled</span>
            </div>
        </div>

        <!-- MAIN GRID -->
        <div class="grid-main">

            <!-- LEFT COL -->
            <div style="display:flex;flex-direction:column;gap:16px;">

                <!-- Video Card -->
                <div class="card gs-reveal" style="padding: 12px;">
                    <div class="video-wrapper">
                        <div class="video-badge"><span class="dot"></span> LIVE</div>
                        <select class="cam-select" id="camera-select" onchange="changeCamera(this.value)">
                            <option value="off">Camera Off</option>
                            <option value="1">Mac</option>
                            <option value="2">iPhone 14 Pro Max</option>
                            <option value="3">iPhone 17 Pro Max</option>
                        </select>
                        <img id="video-feed" src="/video_feed" alt="Video Feed" onerror="this.onerror=null; this.src='data:image/svg+xml;charset=utf-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22640%22 height=%22400%22%3E%3Crect fill=%22%23111%22 width=%22640%22 height=%22400%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23333%22 font-family=%22Inter%22 font-size=%2214%22%3EFEED OFFLINE%3C/text%3E%3C/svg%3E'" style="width:100%; height:100%; object-fit:cover;" />
                    </div>
                </div>

                <!-- Patient Bar -->
                <div class="patient-bar gs-reveal" id="patient-data">
                    <div><div class="label">Patient</div><div class="value" id="p-name">—</div></div>
                    <div><div class="label">Age</div><div class="value" id="p-age">—</div></div>
                    <div><div class="label">Protocol</div><div class="value" id="p-goal" style="color: var(--accent);">—</div></div>
                </div>

                <!-- Stats Row -->
                <div class="stat-row gs-reveal">
                    <div class="stat-card">
                        <div class="stat-label">Exercise</div>
                        <div class="stat-value" id="active-exercise" style="font-size:15px; color: var(--text-primary);">Idle</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Reps</div>
                        <div class="stat-value" id="reps-counter">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Form</div>
                        <div class="stat-value green" id="form-quality">—</div>
                    </div>
                </div>
            </div>

            <!-- RIGHT COL -->
            <div class="right-col">

                <!-- AI Chat -->
                <div class="card ai-chat gs-reveal">
                    <div class="ai-chat-header">
                        <h3><span class="indicator"></span> Therapy Assistant</h3>
                        <button class="mic-btn" id="mic-toggle" onclick="toggleMic()">🎤 OFF</button>
                    </div>
                    <div class="ai-chat-body">
                        <p class="ai-dialogue" id="assistant-dialogue">Waiting for patient scan…</p>
                        <div class="ai-cmd" id="assistant-command">[IDLE]</div>
                    </div>
                </div>

                <!-- Pacer Terminal -->
                <div class="card gs-reveal">
                    <div class="terminal">
                        <div class="terminal-header">
                            <span class="circle" style="background: var(--green);"></span>
                            Robotic Pacer
                        </div>
                        <div class="terminal-body" id="terminal-output">
                            <div class="line-muted">→ System initialized. Awaiting session…</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Emergency Kill Button -->
    <!-- Stop/Resume Toggle Button -->
    <button class="kill-btn" id="kill-btn" onclick="toggleRobotMovement()" title="Toggle Movement">STOP</button>

    <!-- Hidden Audio Player -->
    <audio id="tts-player" class="hidden"></audio>

    <script>
        // ═══════════════════════════════════════════
        // GSAP INTRO SEQUENCE
        // ═══════════════════════════════════════════
        const introTL = gsap.timeline();
        introTL
            .from("#intro-title", { y: 40, opacity: 0, duration: 0.8, ease: "power3.out" })
            .from("#intro-sub", { y: 20, opacity: 0, duration: 0.6, ease: "power3.out" }, "-=0.4")
            .from("#intro-line", { scaleX: 0, duration: 0.6, ease: "power2.inOut" }, "-=0.3")
            .to("#intro", { opacity: 0, duration: 0.5, ease: "power2.in", delay: 0.6 })
            .set("#intro", { display: "none" })
            .to("#app", { opacity: 1, duration: 0.01 })
            .call(() => {
                gsap.utils.toArray(".gs-reveal").forEach((el, i) => {
                    gsap.to(el, {
                        opacity: 1, y: 0,
                        duration: 0.7,
                        delay: i * 0.1,
                        ease: "power3.out"
                    });
                });
            });

        // ═══════════════════════════════════════════
        // WEBSOCKET
        // ═══════════════════════════════════════════
        const ws = new WebSocket(`ws://${window.location.host}/ws`);
        const terminalOutput = document.getElementById("terminal-output");
        const ttsPlayer = document.getElementById("tts-player");
        let currentAudioUrl = "";
        let prevReps = 0;

        let selectedCameraIndex = 'off';
        const videoFeedEl = document.getElementById('video-feed');

        ws.onopen = () => {
            addLog("→ Connected to therapy hub", "line-info");
            // Do not auto-select a camera; user must choose from dropdown
        };

        ws.onmessage = (event) => {
            const state = JSON.parse(event.data);

            // Patient
            document.getElementById("p-name").innerText = state.patient?.name || "—";
            document.getElementById("p-age").innerText = state.patient?.age || "—";
            document.getElementById("p-goal").innerText = state.patient?.therapy_goal || "—";

            // Clinical
            document.getElementById("active-exercise").innerText = state.clinical.active_exercise;
            document.getElementById("form-quality").innerText = state.clinical.form_quality.toUpperCase();

            // Reps with GSAP number pop
            const newReps = state.clinical.reps_count;
            if (newReps !== prevReps) {
                prevReps = newReps;
                const el = document.getElementById("reps-counter");
                el.innerText = newReps;
                gsap.fromTo(el, { scale: 1.6, color: "#fbbf24" }, { scale: 1, color: "#38bdf8", duration: 0.5, ease: "elastic.out(1, 0.4)" });
            }

            // Follow status
            if (state.target_locked !== undefined) {
                const lockText = state.target_locked ? 'Target: locked' : 'Target: unlocked';
                document.getElementById('follow-status').innerText = lockText;
            }

            // AI
            document.getElementById("assistant-dialogue").innerText = state.dialogue;
            document.getElementById("assistant-command").innerText = state.command || "[IDLE]";

            // Terminal
            if (state.roomba_output !== lastOutput) {
                lastOutput = state.roomba_output;
                addLog(`⚙️ CMD: ${lastOutput}`, "");
                
                // Proxy command directly to ESP32
                const cmdByte = driveStringToByte(lastOutput);
                if (cmdByte !== last_esp32_cmd) {
                    if (esp32_ws && esp32_ws.readyState === WebSocket.OPEN) {
                        esp32_ws.send(new Uint8Array([cmdByte]));
                        last_esp32_cmd = cmdByte;
                    }
                }
            }

            // Audio
            if (state.audio_url && state.audio_url !== currentAudioUrl) {
                currentAudioUrl = state.audio_url;
                ttsPlayer.src = currentAudioUrl;
                ttsPlayer.play().catch(e => console.error("Audio blocked:", e));
            }
        };

        ws.onclose = () => addLog("⚠ Connection lost", "line-err");

        function addLog(text, cls) {
            const div = document.createElement("div");
            if (cls) div.className = cls;
            div.innerText = text;
            terminalOutput.appendChild(div);
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
            // Animate in
            gsap.from(div, { x: -10, opacity: 0, duration: 0.3, ease: "power2.out" });
        }

        function scanBracelet(id) {
            addLog(`→ Scanning bracelet: ${id}`, "line-warn");
            ws.send(JSON.stringify({ action: "scan_bracelet", patient_id: id }));
            ttsPlayer.src = "";
            ttsPlayer.play().catch(() => {});

            // Button ripple
            gsap.fromTo(".patient-bar", { borderColor: "rgba(56,189,248,0.4)" }, { borderColor: "rgba(255,255,255,0.04)", duration: 1.2, ease: "power2.out" });
        }

        function changeCamera(index) {
            addLog(`→ Camera switching: ${index}`, "line-warn");
            fetch(`/api/camera/${index}`, { method: "POST" })
                .then(r => r.json())
                .then(() => {
                    const img = document.getElementById("video-feed");
                    if (index === 'off') {
                        img.src = "data:image/svg+xml;charset=utf-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22640%22 height=%22400%22%3E%3Crect fill=%22%23111%22 width=%22640%22 height=%22400%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23333%22 font-family=%22Inter%22 font-size=%2214%22%3EFEED OFFLINE%3C/text%3E%3C/svg%3E";
                    } else {
                        img.src = `/video_feed?t=${Date.now()}`;
                    }
                    addLog(`→ Camera switched to ${index}`, "line-info");
                })
                .catch(err => addLog(`✗ Camera error: ${err}`, "line-err"));
        }

        function unlockTarget() {
            addLog("→ Unlocking follow target...", "line-warn");
            fetch('/api/follow/unlock', { method: 'POST' })
                .then(r => r.json())
                .then(resp => {
                    if (resp.status === 'unlocked') {
                        addLog('✅ Follow target unlocked', 'line-info');
                        document.getElementById('follow-status').innerText = 'Target: unlocked';
                    } else {
                        addLog('⚠ Unable to unlock follow target', 'line-err');
                    }
                })
                .catch(err => addLog(`✗ Unlock error: ${err}`, 'line-err'));
        }

        // ═══════════════════════════════════════════
        // ESP32 DIRECT BROWSER WEBSOCKET (STABILITY FIX)
        // ═══════════════════════════════════════════
        const ESP32_URL = "ws://172.20.10.2/control";
        let esp32_ws = null;
        let last_esp32_cmd = -1;

        function connectESP32() {
            if (esp32_ws) return;
            esp32_ws = new WebSocket(ESP32_URL);
            esp32_ws.binaryType = "arraybuffer";

            esp32_ws.onopen = () => {
                addLog(`⚙️ ESP32 Connected (${ESP32_URL})`, "line-info");
            };
            esp32_ws.onclose = () => {
                addLog(`⚠️ ESP32 Disconnected. Reconnecting...`, "line-err");
                esp32_ws = null;
                setTimeout(connectESP32, 3000);
            };
            esp32_ws.onerror = (err) => {
                esp32_ws.close();
            };
        }

        function driveStringToByte(driveStr) {
            if (!driveStr || !driveStr.includes("drive")) return 4;
            const parts = driveStr.replace("drive", "").trim().split(",");
            if (parts.length !== 2) return 4;
            const vel = parseInt(parts[0]);
            const turn = parseInt(parts[1]);
            
            if (vel === 0 && turn === 0) return 4;
            if (Math.abs(turn) > Math.abs(vel)) return turn > 0 ? 2 : 3;
            return vel > 0 ? 0 : 1;
        }

        connectESP32();

        function toggleRobotMovement() {
            const btn = document.getElementById("kill-btn");
            const isCurrentlyStop = btn.innerText === "STOP";
            
            if (isCurrentlyStop) {
                addLog("🛑 PAUSING MOVEMENT", "line-err");
                gsap.fromTo(btn, 
                    { boxShadow: "0 0 0 0 rgba(220,38,38,0.8)" },
                    { boxShadow: "0 0 40px 20px rgba(220,38,38,0)", duration: 0.6 }
                );
                // Kill ESP move directly for instant response
                if (esp32_ws && esp32_ws.readyState === WebSocket.OPEN) {
                    esp32_ws.send(new Uint8Array([4]));
                }
                last_esp32_cmd = 4;
            } else {
                addLog("▶️ RESUMING MOVEMENT", "line-info");
                gsap.fromTo(btn, 
                    { boxShadow: "0 0 0 0 rgba(52,211,153,0.8)" },
                    { boxShadow: "0 0 40px 20px rgba(52,211,153,0)", duration: 0.6 }
                );
            }
            
            // Sync with backend
            fetch("/api/esp32/toggle", { method: "POST" })
                .then(r => r.json())
                .then(resp => {
                    btn.innerText = resp.label;
                    if (resp.follow_enabled) {
                        btn.style.background = "linear-gradient(135deg, #dc2626, #991b1b)"; // RED
                        document.getElementById('follow-status').innerText = 'Following: enabled';
                    } else {
                        btn.style.background = "linear-gradient(135deg, #f59e0b, #b45309)"; // AMBER
                        document.getElementById('follow-status').innerText = 'Following: paused';
                    }
                });
        }

        // ═══════════════════════════════════════════
        // WEB SPEECH API
        // ═══════════════════════════════════════════
        let recognition;
        let isMicOn = false;

        if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SR();
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = (e) => {
                const t = e.results[e.results.length - 1][0].transcript.trim();
                if (t) {
                    addLog(`🗣 "${t}"`, "line-info");
                    ws.send(JSON.stringify({ action: "kid_speech", text: t }));
                }
            };
            recognition.onerror = (e) => {
                if (e.error === "not-allowed") { toggleMic(); addLog("✗ Mic access denied", "line-err"); }
            };
        } else {
            document.getElementById("mic-toggle").innerText = "🎤 N/A";
            document.getElementById("mic-toggle").disabled = true;
        }

        function toggleMic() {
            if (!recognition) return;
            isMicOn = !isMicOn;
            const btn = document.getElementById("mic-toggle");
            if (isMicOn) {
                btn.innerText = "🎤 ON";
                btn.classList.add("active");
                recognition.start();
                addLog("→ Microphone active", "line-info");
            } else {
                btn.innerText = "🎤 OFF";
                btn.classList.remove("active");
                recognition.stop();
                addLog("→ Microphone off", "line-muted");
            }
        }

        // ═══════════════════════════════════════════
        // STAT HOVER MICRO-ANIM
        // ═══════════════════════════════════════════
        document.querySelectorAll(".stat-card").forEach(card => {
            card.addEventListener("mouseenter", () => {
                // existing hover animation code
            });
            card.addEventListener("mouseleave", () => {
                // no-op
            });
        });

        // ═══════════════════════════════════════════
        // AUTOMATIC QR SCANNER LOOP (using the same /video_feed stream)
        // ═══════════════════════════════════════════
        const knownProfiles = { akhilesh: true, bailey: true, john: true };
        let lastQrValue = null;
        let lastQrAt = 0;

        const qrImage = document.getElementById('video-feed');
        const qrCanvas = document.createElement('canvas');
        const qrContext = qrCanvas.getContext('2d');

        function startQrScanner() {
            const scanLoop = () => {
                if (qrImage.naturalWidth && qrImage.naturalHeight) {
                    qrCanvas.width = qrImage.naturalWidth;
                    qrCanvas.height = qrImage.naturalHeight;
                    try {
                        qrContext.drawImage(qrImage, 0, 0, qrCanvas.width, qrCanvas.height);
                        const imageData = qrContext.getImageData(0, 0, qrCanvas.width, qrCanvas.height);
                        const qrCode = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });

                        if (qrCode && qrCode.data) {
                            const value = String(qrCode.data).trim().toLowerCase();
                            if (knownProfiles[value]) {
                                const now = Date.now();
                                if (value !== lastQrValue || (now - lastQrAt) > 3000) {
                                    lastQrValue = value;
                                    lastQrAt = now;
                                    addLog(`📷 QR matched: ${value}`, 'line-info');
                                    scanBracelet(value);
                                }
                            }
                        }
                    } catch (err) {
                        // sometimes the image is not ready for draw due loading transients
                    }
                }
                requestAnimationFrame(scanLoop);
            };
            requestAnimationFrame(scanLoop);
        }

        startQrScanner();

        // ═══════════════════════════════════════════
        // AMBIENT ORB DRIFT
        // ═══════════════════════════════════════════
        gsap.to(".ambient-bg", {
            backgroundPosition: "100% 100%",
            duration: 20,
            repeat: -1,
            yoyo: true,
            ease: "sine.inOut"
        });
    </script>
</body>
</html>
